[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iro"
version = "0.1.0"
description = "Solvency II-aware portfolio optimiser for an insurance balance sheet"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "cvxpy>=1.5",
    "clarabel>=0.9",
    "streamlit>=1.35",
    "plotly>=5.20",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
